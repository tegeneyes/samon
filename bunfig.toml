[install]
saveTextLockfile = true
# 24h supply-chain guard: skip package versions published less than a day ago.
minimumReleaseAge = 86400
# Allow the TanStack packages and Lovable packages used in this app to install
# even when they are freshly published and still within the 24h guard window.
minimumReleaseAgeExcludes = [
  "@tanstack/react-router",
  "@tanstack/react-start",
  "@tanstack/router-plugin",
  "@lovable.dev/vite-tanstack-config",
  "@lovable.dev/mcp-js",
  "@lovable.dev/ai-gateway",
  "@lovable.dev/email-js",
  "@lovable.dev/webhooks-js",
]
